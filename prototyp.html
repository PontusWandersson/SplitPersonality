<title>ALTER EGO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;500;600;700&family=Knewave&display=swap">
<style>
/* ALTER EGO byggs på UI-basen från C&T Maniac (docs/ui-bas i C&T-mappen): fast design som skalas som en bild
   (dator 1408 x 1018, telefon 390 bred), samma platser och storlekar som C&T, färgtoken och typsnitt därifrån.
   Platserna står i tabellen POS i skriptet (samma siffror som i specen). Temat (bakgrund, ram, logga, symboler) är
   ALTER EGO:s eget. Ett medvetet mörkt utseende, samma i båda lägena. */
:root {
  color-scheme: dark;
  --ink: #15111f;
  --paper: #fff6e0;
  --sun: #ffd21f;
  --orange: #ff8629;
  --pop: #ff3b3b;
  --sky: #1d47d1;
  --mint: #3ccf6e;
  --l1: #2f7bff;
  --l2: #3ccf6e;
  --l3: #ff3b3b;
  --btn: rgba(21, 17, 31, .82);
  --barbg: rgba(21, 17, 31, .84);
  --plum: #3a1f4f;
  --display: "Bangers", "Impact", "Arial Black", sans-serif;
  --ui: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --graf: "Knewave", "Bangers", "Impact", sans-serif;
  --uiz: 1;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--paper); font-family: var(--ui);
  background-color: #1a1024;
  background-image:
    radial-gradient(circle at 50% 45%, rgba(255, 134, 41, .22) 0, rgba(255, 134, 41, 0) 38%),
    radial-gradient(circle at 50% 50%, #2c1840 0, #1a1024 55%, #0f0a17 100%);
}
/* serietidningens rasterpunkter i bakgrunden */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18;
  background-image: radial-gradient(circle, rgba(255, 246, 224, .5) 1px, transparent 1.6px); background-size: 14px 14px;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 30%, #000 85%); mask-image: radial-gradient(circle at 50% 50%, transparent 30%, #000 85%);
}
button { font: inherit; color: inherit; cursor: pointer; padding: 0; }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* #wrap är fast och klipper, så att spelets fasta storlek aldrig räknas in i sidans bredd (annars zoomar mobilen ut) */
#wrap { position: fixed; inset: 0; overflow: hidden; }
#game { position: absolute; left: 0; top: 0; width: 1408px; height: 1018px; transform-origin: 0 0; transform: scale(var(--uiz)); }
#game.phone { width: 390px; height: 700px; }
.abs { position: absolute; }
.hide { display: none !important; }

/* topprundknapparna: mörka rutor med ljus ikon och ljus kant */
.tbtn { display: grid; place-items: center; border-radius: 12px; background: var(--btn); border: 2px solid rgba(255, 246, 224, .85); color: var(--paper); }
.tbtn svg { width: 55%; height: 55%; }
.tbtn.word { font-family: var(--display); font-size: 21px; letter-spacing: .03em; }
#btnSound { background: var(--sun); color: var(--ink); border-color: var(--ink); }
#btnLang { font-family: var(--display); font-size: 17px; letter-spacing: .04em; display: flex; gap: 6px; align-items: center; justify-content: center; }
#btnLang i { font-style: normal; opacity: .4; } #btnLang b { color: var(--sun); font-weight: 400; } #btnLang .sep { opacity: .6; }

/* loggan */
#logo { display: grid; place-items: center; pointer-events: none; }
#logo span { font-family: var(--graf); font-size: 58px; line-height: 1; letter-spacing: .02em; color: var(--orange); white-space: nowrap; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  text-shadow: 3px 3px 0 #7a1f6e, 5px 5px 0 #4b1245, 7px 7px 0 var(--ink); transform: rotate(-3deg); }
#logo span em { font-style: normal; color: var(--paper); }
#game.phone #logo span { font-size: 27px; -webkit-text-stroke: 2px var(--ink); text-shadow: 2px 2px 0 #7a1f6e, 3px 3px 0 var(--ink); }

/* LAYERSPINS-märket och lagerbrickorna */
#brand { display: flex; align-items: center; gap: 10px; justify-content: center; }
#brand .bx { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; width: 46px; height: 46px; padding: 5px; border-radius: 10px; background: var(--paper); border: 3px solid var(--ink); transform: rotate(-6deg); }
#brand .bx i { border-radius: 3px; border: 2px solid var(--ink); } #brand .bx i:nth-child(1) { background: var(--l1); } #brand .bx i:nth-child(2) { background: var(--l2); } #brand .bx i:nth-child(3) { background: var(--l3); } #brand .bx i:nth-child(4) { background: var(--orange); }
#brand span { font-family: var(--display); font-size: 34px; letter-spacing: .04em; color: #fff; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink); transform: rotate(-4deg); }
#brand sup { font-size: 14px; }
#game.phone #brand span { font-size: 36px; } #game.phone #brand .bx { width: 42px; height: 42px; }
#baseLag { display: grid; gap: 10px; align-content: start; }
#game.phone #baseLag { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lag { position: relative; height: 50px; display: grid; place-items: center; font-family: var(--display); font-size: 31px; letter-spacing: .05em; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 2px 2px 0 var(--ink);
  border: 3px solid var(--ink); border-radius: 12px 18px 12px 18px; transform: skewX(-8deg) rotate(-2deg); background: #6f6a78; opacity: .55; }
#game.phone .lag { height: 33px; font-size: 19px; border-width: 2px; transform: skewX(-6deg); }
#game.phone .lag.fly { animation: none; }
.lag.on { opacity: 1; }
.lag.l1.on { background: var(--l1); } .lag.l2.on { background: var(--l2); } .lag.l3.on { background: var(--l3); }
.lag b { position: absolute; right: -8px; top: -10px; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 12px; background: var(--paper); color: var(--ink); -webkit-text-stroke: 0; text-shadow: none; font-size: 16px; display: grid; place-items: center; border: 2px solid var(--ink); }
#game.phone .lag b { right: -5px; top: -8px; min-width: 18px; height: 18px; font-size: 12px; }
.lag.fly { animation: fly .6s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes fly { 0% { transform: translateX(-40px) skewX(-8deg) rotate(-8deg) scale(1.2); filter: brightness(1.8); } 100% { transform: skewX(-8deg) rotate(-2deg); filter: none; } }

/* köpaffischen (dator) och köpbrickan (telefon) */
#btnBuy { display: grid; justify-items: center; align-content: center; gap: 10px; background: var(--paper); color: var(--ink); border: 0; border-radius: 6px;
  clip-path: polygon(2% 3%, 30% 0, 62% 2%, 98% 0, 100% 30%, 97% 62%, 100% 97%, 66% 100%, 35% 97%, 0 100%, 3% 66%, 0 33%); transform: rotate(-3deg); box-shadow: inset 0 0 40px rgba(122, 31, 110, .25); }
#btnBuy .k { font-family: var(--display); font-size: 30px; letter-spacing: .04em; background: var(--ink); color: var(--paper); padding: 2px 12px; border-radius: 6px; transform: rotate(2deg); }
#btnBuy .odd { font-family: var(--graf); font-size: 64px; line-height: .9; color: var(--paper); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--orange); }
#btnBuy .plus { width: 72px; height: 72px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--display); font-size: 52px; line-height: 1; border: 4px solid var(--orange); }
#btnBuy small { font-size: 13px; font-weight: 600; opacity: .7; }
#buyChip { border-radius: 50%; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); display: grid; place-items: center; text-align: center; font-family: var(--graf); font-size: 12px; line-height: .9; box-shadow: 0 0 0 2px var(--orange); overflow: hidden; }
#buyChip b { font-family: var(--display); font-weight: 400; font-size: 9px; letter-spacing: .04em; display: block; }

/* ramen, scenen och brädet */
#frame { border-radius: 30px; background: #120d1b; border: 4px solid var(--ink);
  box-shadow: 0 0 0 5px var(--orange), 0 0 0 9px var(--ink), 0 0 0 14px #5c2a6e, 0 24px 60px rgba(0, 0, 0, .55), inset 0 0 0 6px #241634; }
#game.phone #frame { border-radius: 18px; box-shadow: 0 0 0 3px var(--orange), 0 0 0 5px var(--ink), 0 0 0 8px #5c2a6e, 0 12px 30px rgba(0, 0, 0, .5), inset 0 0 0 3px #241634; }
#board { display: block; border-radius: 10px; touch-action: manipulation; }

/* saldo och vinst i ramens nederkant */
.money { display: grid; gap: 0; align-content: center; padding: 0 12px; border-radius: 10px; background: rgba(21, 17, 31, .92); border: 2px solid rgba(255, 246, 224, .18); }
.money span { font-family: var(--ui); font-weight: 700; font-size: 11px; letter-spacing: .14em; opacity: .8; }
.money b { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .04em; line-height: 1.1; font-variant-numeric: tabular-nums; }
#winBox { text-align: right; } #winBox b { color: var(--sun); }
#winBox b.count { animation: bump .35s ease-out; }
#game.phone .money { padding: 0 9px; } #game.phone .money b { font-size: 16px; } #game.phone .money span { font-size: 9px; }
@keyframes bump { 0% { transform: scale(1.18); } 100% { transform: none; } }

/* knappraden: insats, −, SPIN, +, autospel, turbo */
#bar { border-radius: 30px; background: var(--barbg); border: 2px solid rgba(255, 246, 224, .14); }
#betBox { display: grid; align-content: center; padding-left: 6px; }
#betBox span { font-weight: 700; font-size: 11px; letter-spacing: .14em; opacity: .8; }
#betBox b { font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .04em; line-height: 1; font-variant-numeric: tabular-nums; }
#game.phone #betBox span { font-size: 9px; } #game.phone #betBox b { font-size: 18px; }
.pm { display: grid; place-items: center; border-radius: 20px; background: rgba(255, 246, 224, .06); border: 0; color: var(--sun); font-family: var(--display); font-size: 34px; line-height: 1; }
.pm:disabled { opacity: .3; cursor: default; }
#spin { border-radius: 50%; background: var(--sun); color: var(--ink); border: 5px solid var(--ink); box-shadow: 0 0 0 3px rgba(255, 210, 31, .45), 0 8px 22px rgba(0, 0, 0, .5); display: grid; place-items: center; transition: transform .1s; }
#spin:active { transform: scale(.94); }
#spin svg { width: 52%; height: 52%; }
#spin.stop { background: var(--pop); color: var(--paper); }
.sq { display: grid; place-items: center; border-radius: 9px; background: var(--btn); border: 2px solid rgba(255, 246, 224, .7); color: var(--paper); }
.sq svg { width: 58%; height: 58%; }
.sq.on { background: var(--orange); border-color: var(--paper); color: var(--ink); }
.sq em { position: absolute; top: -9px; right: -10px; font-style: normal; font-family: var(--display); font-size: 13px; background: var(--sun); color: var(--ink); border-radius: 999px; padding: 1px 6px; border: 2px solid var(--ink); }

/* figuren (dator, till höger om ramen) */
#mascot { pointer-events: none; }
#mascot img { position: absolute; inset: 0 0 34px 0; width: 100%; height: calc(100% - 34px); object-fit: contain; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .5)); }
#mascot.pump img { animation: pump .5s ease-out; }
@keyframes pump { 0% { transform: scale(1.15); } 100% { transform: none; } }
#mascot b { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%) rotate(-3deg); font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .05em; padding: 2px 14px; border-radius: 10px; background: var(--ink); border: 3px solid #6f6a78; white-space: nowrap; }

/* popover-menyer och överlägg (utanför den skalade spelytan) */
.pop { position: absolute; z-index: 30; background: #1d1529; border: 2px solid rgba(255, 246, 224, .3); border-radius: 14px; padding: 10px; display: grid; gap: 6px; min-width: 230px; box-shadow: 0 16px 40px rgba(0, 0, 0, .55); font-family: var(--ui); }
.pop h3 { margin: 2px 4px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
.pop button { text-align: left; padding: 8px 10px; border-radius: 9px; background: rgba(255, 246, 224, .06); border: 1px solid rgba(255, 246, 224, .18); font-size: 15px; font-weight: 500; }
.pop button:hover { border-color: var(--orange); }
.pop .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pop .row button { text-align: center; font-family: var(--display); font-size: 20px; }
.pop dl { margin: 4px; display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.pop dt { opacity: .7; } .pop dd { margin: 0; text-align: right; font-weight: 600; }
.ov { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(8, 5, 14, .76); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { position: relative; width: min(100%, 660px); max-height: 100%; overflow: auto; background: #1d1529; border: 2px solid rgba(255, 246, 224, .25); border-radius: 20px; padding: 22px; display: grid; gap: 14px; font-family: var(--ui); }
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; letter-spacing: .04em; color: var(--orange); }
.card ul { margin: 0; padding-left: 20px; display: grid; gap: 7px; font-size: 16px; line-height: 1.4; }
.card .x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); border: 2px solid var(--paper); display: grid; place-items: center; }
.card .x svg { width: 18px; height: 18px; }
.paywrap { overflow-x: auto; }
.pay { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
.pay th, .pay td { padding: 5px 6px; text-align: right; border-bottom: 1px solid rgba(255, 246, 224, .14); white-space: nowrap; }
.pay th:first-child, .pay td:first-child { text-align: left; }
.pay th { opacity: .7; font-weight: 600; }
.pay svg, .pay .ico { width: 22px; height: 22px; object-fit: contain; vertical-align: -6px; margin-right: 6px; }
.note { margin: 0; opacity: .7; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 45; background: var(--ink); border: 2px solid var(--orange); border-radius: 12px; padding: 10px 14px; font-size: 15px; max-width: calc(100% - 32px); font-family: var(--ui); }

/* storvinsten (inne i spelytan, skalas med den) */
#bw { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: radial-gradient(circle at 50% 50%, rgba(21, 17, 31, .55), rgba(8, 5, 14, .88) 70%); cursor: pointer; }
#bw canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.bwin { position: relative; display: grid; justify-items: center; gap: 10px; padding: 46px 70px 40px; border-radius: 50%; }
.bwin .oval { position: absolute; inset: 0; border-radius: 50%; border: 8px solid var(--tc); box-shadow: 0 0 0 5px var(--ink), inset 0 0 0 5px var(--ink), 0 0 60px var(--tc); background: rgba(21, 17, 31, .85); }
.bwin .crown { position: relative; width: 74px; height: 50px; margin-top: -20px; }
.bwin .ttl { position: relative; font-family: var(--graf); font-size: 76px; line-height: 1; color: var(--tc); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--ink); white-space: nowrap; }
.bwin .ttl.trick { animation: trick .55s ease-out; }
@keyframes trick { 0% { transform: scale(1.35) rotate(-6deg); } 50% { transform: scale(.94) rotate(3deg); } 100% { transform: none; } }
.bwin .amt { position: relative; font-family: var(--display); font-size: 64px; letter-spacing: .04em; line-height: 1; font-variant-numeric: tabular-nums; }
.bwin .xx { position: relative; font-weight: 600; font-size: 18px; opacity: .8; }
.bwin .meter { position: relative; width: 340px; height: 16px; border-radius: 10px; background: rgba(255, 246, 224, .12); border: 2px solid var(--ink); overflow: hidden; }
.bwin .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--tc); }
#bw .tap { position: absolute; left: 0; right: 0; bottom: 9%; text-align: center; font-family: var(--display); font-size: 30px; letter-spacing: .06em; color: #fff; animation: pulse 1.2s ease-in-out infinite; }
#game.phone .bwin { padding: 30px 26px 26px; } #game.phone .bwin .ttl { font-size: 40px; -webkit-text-stroke: 2.5px var(--ink); } #game.phone .bwin .amt { font-size: 38px; } #game.phone .bwin .meter { width: 220px; } #game.phone #bw .tap { font-size: 20px; }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div id="wrap">
<div id="game" class="desk">
  <button class="abs tbtn word" id="btnTest" aria-haspopup="true">TEST</button>
  <button class="abs tbtn" id="btnInfo" data-l="aria:Regler och vinsttabell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.2v.1"/></svg></button>

    state.roundWin += amount; setWin(state.roundWin, true);
    await wait(showTime(winShowT(cls, acc)), true);
    state.phase = 'pop'; sweepFx = null; popFx = null;
    Sound.pop(idx);
    for (var r = 0; r < REELS; r++) reels[r].cells.forEach(function (cl) {
      if (cl.win) { cl.pop = 0; shards((r + 0.5) * cell, (cl.y + 0.5) * cell, SHARD[cl.sym], 7); }
    });
    for (c = 0; c < CELLS; c++) pos[c].hit.forEach(function (h, k) {
      if (h) { pos[c].gone[k] = clock; var cs = CORNER[k]; shards((c % N + (cs[0] ? 0.78 : 0.22)) * cell, (Math.floor(c / N) + (cs[1] ? 0.78 : 0.22)) * cell, LAYC[k], 4, 0.6); }
    });
    await wait(showTime(T().popWait * acc * (cls === 0 ? 0.5 : 1)));
    applyMoves(st.moves);
    syncPos(st.after, true);
    var anyUp = false;
    for (c = 0; c < CELLS; c++) if (st.lvup[c]) { pos[c].lvT = clock; anyUp = true; }
    st.grow.forEach(function (z) { pos[z].lvT = clock; });
    if (anyUp) Sound.lvup();
    st.bursts.forEach(function (z, k) {
      pos[z].burstT = clock;
      shards((z % N + 0.5) * cell, (Math.floor(z / N) + 0.5) * cell, '#fff6e0', 12, 1.3);
      if (k === 0) floatText((z % N + 0.5) * cell, (Math.floor(z / N) + 0.3) * cell, txl('SPRICKER!'), '#ff8629');
    });
    if (st.bursts.length) { setMascot(4, 1.6); Sound.burst(); }
    await waitFor(function () { return reels.every(function (x) { return x.settled(); }); });
    await wait(showTime(T().between * acc), true);
    state.phase = 'tumble';
  }
  function setWin(v, count) {
    var el = $('#vinst');
    el.textContent = moneyCur(v);
    if (count) { el.classList.remove('count'); void el.offsetWidth; el.classList.add('count'); }
  }
  async function spin(seed, test) {
    if (state.busy) return;
    var b = bet();
    if (!test && state.balance < b - 1e-9) { toast(txl('Saldot räcker inte. Sänk insatsen eller fyll på saldot under TEST.')); state.auto = 0; hud(); return; }
    closePops();
    state.busy = true; state.slam = false; state.hurry = false; state.roundWin = 0;
    if (!test) { state.balance -= b; state.stats.spins++; state.stats.bet += b; }
    setWin(0);
    var g = M.playGame(M.mulberry32(seed), true), base = g.base, rec = base.record || [];
    clearLayers();
    hud();
    await spinReels(base.start);
    state.phase = 'idle'; hud();
    if (rec.length) await wait(showTime(0.15), true);
    for (var i = 0; i < rec.length; i++) await presentStep(rec[i], i);
    for (var r = 0; r < REELS; r++) reels[r].cells.forEach(function (c) { c.win = false; });
    state.phase = 'idle';
    var win = g.x * b, x = g.x;
    state.roundWin = win; setWin(win, false);
    if (x >= 10) await bigWin(win, x);
    if (!test) {
      state.balance += win; state.stats.won += win;
      if (win > state.stats.best) { state.stats.best = win; state.stats.bestX = x; }
      if (rec.length > state.stats.longest) state.stats.longest = rec.length;
    }
    state.busy = false; state.hurry = false; nextIdle = clock + 1.2;
    hud();
    if (!test && state.auto > 0) {
      await wait(0.35);
      if (state.auto > 0 && !state.busy) { state.auto--; hud(); spin(rand32(), false); }
    }
  }

  // ------------------------------------------------------------ storvinsten: sju nivåer (som C&T), räknas upp med mätare och konfetti
  var TIERS = [
    { x: 10, t: 'BIG WIN', c: '#ff8629' }, { x: 20, t: 'EPIC WIN', c: '#b45cff' }, { x: 50, t: 'MEGA WIN', c: '#2f7bff' },
    { x: 150, t: 'SUPER WIN', c: '#3ccf6e' }, { x: 500, t: 'ULTRA WIN', c: '#ff3b3b' }, { x: 2000, t: 'INSANE WIN', c: '#ff5fd0' },
    { x: 10000, t: 'INFINITY WIN', c: '#ffd21f' }
  ];
  function tierAt(x) { var k = 0; for (var i = 0; i < TIERS.length; i++) if (x >= TIERS[i].x) k = i; return k; }
  function bigWin(win, x) {
    return new Promise(function (res) {
      var top = tierAt(x), per = state.turbo ? 0.55 : 1.15, dur = per * (top + 1), t0 = performance.now(), done = false, shown = -1, conf = [];
      var ov = document.createElement('div'); ov.id = 'bw';
      ov.innerHTML = '<canvas></canvas><div class="bwin" role="dialog" aria-live="polite"><div class="oval"></div>' +
        '<svg class="crown" viewBox="0 0 74 50" aria-hidden="true"><path d="M6 44L2 10l18 14L37 2l17 22 18-14-4 34z" style="fill:var(--tc)" stroke="#15111f" stroke-width="4" stroke-linejoin="round"/></svg>' +
        '<div class="ttl"></div><div class="amt"></div><div class="xx"></div><div class="meter"><i></i></div></div><div class="tap">' + txl('Klicka var som helst') + '</div>';
      $('#game').appendChild(ov);
      var cv = ov.querySelector('canvas'), g = cv.getContext('2d'), ttl = ov.querySelector('.ttl'), amt = ov.querySelector('.amt'), xx = ov.querySelector('.xx'), bar = ov.querySelector('.meter i'), box = ov.querySelector('.bwin');
      cv.width = POS[mode].size[0]; cv.height = POS[mode].size[1];
      function fountain(color) {
        for (var i = 0; i < 26; i++) {
          var left = i % 2 === 0, a = (left ? -1.1 : -2.05) + (Math.random() - 0.5) * 0.5, sp = 600 + Math.random() * 500;
          conf.push({ x: left ? cv.width * 0.18 : cv.width * 0.82, y: cv.height * 0.95, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 6, vr: (Math.random() - 0.5) * 12, c: Math.random() < 0.5 ? color : ['#fff6e0', '#ffd21f', '#ff8629'][i % 3], life: 0 });
        }
      }
      var lastT = performance.now();
      function tick(now) {
        if (done) return;
        var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
        var k = Math.min(1, (now - t0) / 1000 / dur), cur = x * k;
        var tk = tierAt(Math.max(10, cur)), T0 = TIERS[tk], T1 = TIERS[Math.min(TIERS.length - 1, tk + 1)];
        if (tk !== shown) {
          shown = tk; box.style.setProperty('--tc', T0.c); ttl.textContent = T0.t;
          ttl.classList.remove('trick'); void ttl.offsetWidth; ttl.classList.add('trick'); fountain(T0.c); Sound.big();
        }
        amt.textContent = moneyCur(win * k);
        xx.textContent = txl('{x} gånger insatsen', { x: (x * k).toLocaleString(LANG === 'en' ? 'en-GB' : 'sv-SE', { maximumFractionDigits: 1 }) });
        bar.style.width = (tk === TIERS.length - 1 ? 100 : Math.max(0, Math.min(1, (cur - T0.x) / (T1.x - T0.x))) * 100) + '%';
        g.clearRect(0, 0, cv.width, cv.height);
        for (var i = conf.length - 1; i >= 0; i--) {
          var p = conf[i]; p.life += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
          if (p.life > 2.4) { conf.splice(i, 1); continue; }
          g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-6, -3.5, 12, 7); g.restore();
        }
        if (k >= 1 && !ov.dataset.end) { ov.dataset.end = '1'; setTimeout(close, state.auto > 0 ? 1400 : 4000); }
        requestAnimationFrame(tick);
      }
      function close() { if (done) return; done = true; ov.remove(); res(); }
      ov.addEventListener('click', function () { if (!ov.dataset.end) t0 = -1e9; else close(); });
      requestAnimationFrame(tick);
    });
  }

  // ------------------------------------------------------------ gränssnittet
  var SPIN_ICO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>';
  var STOP_ICO = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  var SND_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var SND_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function hud() {
    $('#saldo').textContent = moneyCur(state.balance);
    $('#bet').textContent = money(bet());
    $('#betDown').disabled = state.busy || state.betIdx === 0;
    $('#betUp').disabled = state.busy || state.betIdx === BETS.length - 1;
    var sp = $('#spin'), spinning = state.phase === 'spinning';
    sp.classList.toggle('stop', spinning);
    sp.innerHTML = spinning ? STOP_ICO : SPIN_ICO;
    sp.setAttribute('aria-label', txl(spinning ? 'Stoppa hjulen' : state.busy ? 'Visa snabbare' : 'Snurra'));
    var ab = $('#btnAuto');
    ab.classList.toggle('on', state.auto > 0);
    var em = ab.querySelector('em'); if (em) em.remove();
    if (state.auto > 0) { em = document.createElement('em'); em.textContent = state.auto; ab.appendChild(em); }
    $('#btnTurbo').classList.toggle('on', state.turbo);
    $('#btnTurbo').setAttribute('aria-pressed', String(state.turbo));
    $('#btnSound').innerHTML = state.sound ? SND_ON : SND_OFF;
    $('#btnSound').setAttribute('aria-pressed', String(state.sound));
    $('#btnSound').setAttribute('aria-label', txl(state.sound ? 'Ljud på' : 'Ljud av'));
  }
  function rand32() { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; }
  function press() {
    if (!state.busy) { state.auto = 0; spin(rand32(), false); return; }
    if (state.phase === 'spinning') { state.slam = true; skipWaits(); }
    else { state.hurry = true; skipWaits(); }
    hud();
  }
  var toastT = null;
  function toast(msg) {
    var t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(function () { t.remove(); }, 3200);
  }
  function closePops() { document.querySelectorAll('.pop').forEach(function (p) { p.remove(); }); }
  function popover(anchor, html, above) {
    closePops();
    var p = document.createElement('div'); p.className = 'pop'; p.innerHTML = html; document.body.appendChild(p);
    var r = anchor.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
    p.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
    p.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, above ? r.top - h - 10 : r.bottom + 8)) + 'px';
    setTimeout(function () { document.addEventListener('pointerdown', function off(e) { if (!p.contains(e.target) && !anchor.contains(e.target)) { p.remove(); document.removeEventListener('pointerdown', off); } }); }, 0);
    return p;
  }
  function findSeed(pred) {
    for (var i = 0; i < 300000; i++) { var s = rand32(); if (pred(M.playGame(M.mulberry32(s), false))) return s; }
    return null;
  }
  function test(pred) {
    closePops(); state.auto = 0;
    var s = findSeed(pred);
    if (s === null) { toast(txl('Hittade inget sådant utfall den här gången. Prova igen.')); return; }
    spin(s, true);
  }
  $('#btnTest').addEventListener('click', function () {
    if (state.busy) return;
    var st = state.stats, rtp = st.bet ? (100 * st.won / st.bet).toLocaleString(LANG === 'en' ? 'en-GB' : 'sv-SE', { maximumFractionDigits: 1 }) + ' %' : '–';
    var p = popover(this, '<h3>' + txl('TEST · riktiga utfall, kostar inget') + '</h3>' +
      '<button data-t="burst">' + txl('Lavin med LAYER 3 och spricka') + '</button>' +
      '<button data-t="long">' + txl('Lång lavin (12+ steg)') + '</button>' +
      '<button data-t="big">' + txl('Stor vinst (100x+)') + '</button>' +
      '<button data-t="refill">' + txl('Fyll på saldot') + '</button>' +
      '<h3>' + txl('Passet') + '</h3><dl><dt>' + txl('Snurr') + '</dt><dd>' + st.spins + '</dd><dt>' + txl('Återbetalt') + '</dt><dd>' + rtp + '</dd><dt>' + txl('Största vinst') + '</dt><dd>' + (st.best ? moneyCur(st.best) : '–') + '</dd><dt>' + txl('Längsta lavin') + '</dt><dd>' + (st.longest ? txl('{n} steg', { n: st.longest }) : '–') + '</dd></dl>', false);
    p.addEventListener('click', function (e) {
      var t = e.target.closest && e.target.closest('[data-t]'); t = t && t.getAttribute('data-t');
      if (t === 'burst') test(function (g) { return g.base.bursts > 0; });
      if (t === 'long') test(function (g) { return g.base.steps >= 12; });
      if (t === 'big') test(function (g) { return g.x >= 100; });
      if (t === 'refill') { state.balance = 1000; closePops(); hud(); }
    });
  });
  $('#btnAuto').addEventListener('click', function () {
    if (state.auto > 0) { state.auto = 0; hud(); return; }
    var p = popover(this, '<h3>' + txl('Autospel') + '</h3><div class="row"><button data-n="10">10</button><button data-n="25">25</button><button data-n="50">50</button><button data-n="100">100</button></div>', true);
    p.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('[data-n]'), n = b ? parseInt(b.getAttribute('data-n'), 10) : 0;
      if (!n) return;
      closePops(); state.auto = n - 1; hud();
      if (!state.busy) spin(rand32(), false);
    });
  });
  $('#btnTurbo').addEventListener('click', function () { state.turbo = !state.turbo; hud(); });
  $('#betDown').addEventListener('click', function () { if (state.betIdx > 0) { state.betIdx--; hud(); } });
  $('#betUp').addEventListener('click', function () { if (state.betIdx < BETS.length - 1) { state.betIdx++; hud(); } });
  $('#spin').addEventListener('click', press);
  canvas.addEventListener('click', function () { if (state.busy) press(); });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !e.repeat && !document.querySelector('.ov') && !document.getElementById('bw') && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); press(); }
  });
  function toggleSound() { state.sound = !state.sound; store.set('sound', state.sound); if (state.sound) { audio(); tone(660, 0.12, { vol: 0.08 }); } hud(); }
  $('#btnSound').addEventListener('click', toggleSound);
  $('#btnLang').addEventListener('click', function () { LANG = LANG === 'sv' ? 'en' : 'sv'; store.set('lang', LANG); applyLang(); });
  function fullscreen() {
    try {
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () { toast(txl('Helskärm går inte här.')); });
      else toast(txl('Helskärm går inte här.'));
    } catch (e) { toast(txl('Helskärm går inte här.')); }
  }
  $('#btnFull').addEventListener('click', fullscreen);
  function buyLater() { toast(txl('Bonusen kommer i ett senare steg.')); }
  $('#btnBuy').addEventListener('click', buyLater);
  $('#buyChip').addEventListener('click', buyLater);
  function showRules() {
    var b = bet(), sizes = [5, 8, 10, 15, 20, 30, 50], rows = '';
    for (var s = 0; s < 8; s++) rows += '<tr><td>' + iconHTML(s) + txl(NAMES[s]) + '</td>' + sizes.map(function (z) { return '<td>' + money(M.payFor(s, z) * b) + '</td>'; }).join('') + '</tr>';
    var ov = document.createElement('div'); ov.className = 'ov';
    ov.innerHTML = '<div class="card" role="dialog" aria-label="' + txl('Så funkar det') + '"><button class="x" aria-label="✕"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><h2>' + txl('Så funkar det') + '</h2><ul>' +
      ['R1', 'R2', 'R3', 'R4', 'R5', 'R6', 'R7', 'R8'].map(function (k) { return '<li>' + txl(k) + '</li>'; }).join('') + '</ul>' +
      '<div class="paywrap"><table class="pay"><thead><tr><th>' + txl('Storlek') + '</th>' + sizes.map(function (z) { return '<th>' + z + (z === 50 ? '+' : '') + '</th>'; }).join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="note">' + txl('Vinst vid insatsen {b}. Storlek = rutor + lager.', { b: moneyCur(b) }) + '</p></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function (e) { if (e.target === ov || e.target.closest('.x')) ov.remove(); });
  }
  $('#btnInfo').addEventListener('click', showRules);
  $('#btnMenu').addEventListener('click', function () {
    var p = popover(this, '<button data-m="rules">' + txl('Så funkar det') + '</button><button data-m="sound">' + txl('Ljud') + ': ' + txl(state.sound ? 'Ljud på' : 'Ljud av') + '</button><button data-m="lang">' + txl('Språk') + ': ' + (LANG === 'sv' ? 'Svenska · kr' : 'English · €') + '</button>' + (mode === 'desk' ? '<button data-m="full">' + txl('Helskärm') + '</button>' : ''), false);
    p.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('[data-m]'), m = b && b.getAttribute('data-m');
      closePops();
      if (m === 'rules') showRules();
      if (m === 'sound') toggleSound();
      if (m === 'lang') { LANG = LANG === 'sv' ? 'en' : 'sv'; store.set('lang', LANG); applyLang(); }
      if (m === 'full') fullscreen();
    });
  });

  // ------------------------------------------------------------ start
  function start(data) {
    if (data && typeof data.balance === 'number') { state.balance = data.balance; state.betIdx = data.betIdx; state.turbo = !!data.turbo; state.stats = data.stats || state.stats; }
    layout();
    var s = findSeed(function (g) { return g.base.steps >= 3 && g.base.maxLv >= 2; });
    var g = M.playGame(M.mulberry32(s === null ? 7 : s), true), end = g.base.end;
    for (var r = 0; r < REELS; r++) { var col = []; for (var y = 0; y < ROWS; y++) col.push(end.top[y * N + r]); reels[r].setGrid(col); }
    syncPos(end, false);
    applyLang();
    window.addEventListener('resize', layout);
    if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('20px Bangers'), document.fonts.load('20px Knewave')]).catch(function () {});
    last = performance.now(); frame(last);
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { balance: state.busy ? state.balance + bet() : state.balance, betIdx: state.betIdx, turbo: state.turbo, stats: state.stats }; });
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
